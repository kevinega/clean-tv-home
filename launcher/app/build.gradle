plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.clean.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.clean.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
